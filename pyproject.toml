[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklmlm"
version = "0.1.0"
description = "An extensible notebook runtime with persistent SQL bookmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seriki Walter Yakub" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
notebooklmlm = "notebooklmlm.cli:main"

[tool.setuptools.packages.find]
include = ["notebooklmlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
